profile: gb10
mode: local_competition
notes: >-
  Competition profile (ARM64 Linux, 128 GB unified memory). Filled on event day
  (2026-10-03, D02) from the live GB10: one vLLM 0.21.0 server
  (nvcr.io/nvidia/vllm:26.05.post1-py3), local, published on 127.0.0.1. Qwen :8000 is
  also published on the OpenShell bridge gateway 172.18.0.1:8000 and is the OpenClaw agent's
  brain via inference.local (NemoClaw provider vllm-local). DOCUMENTED DEVIATION: the
  reasoning slot is served by the same local Qwen3.6 35B-A3B as perception, not
  Mistral/Ministral. The offline bundle has no Mistral weights and venue Wi-Fi made the
  download impractical (user-approved). An earlier choice, Cosmos-Reason2-8B on :8001, was
  dropped later on 2026-10-03 to mimic the original safety notebook, which uses Qwen 3.6
  for both the review and the reasoning/audit pass. The adapter interface is unchanged;
  QWEN_MODEL / MISTRAL_MODEL still override the ids. No cloud route anywhere.
perception:
  backend: openai_compatible
  base_url: http://127.0.0.1:8000/v1
  # Served from /models/nvidia__Qwen3.6-35B-A3B-NVFP4 (fp8 KV cache, 12 GiB KV cap,
  # tool parser qwen3_xml, reasoning parser qwen3).
  model: nvidia/Qwen3.6-35B-A3B-NVFP4
  quantization: NVFP4
  timeout_seconds: 120
  max_tokens: 1024
  temperature: 0.0
  retries: 2
  think: false
  think_param: chat_template_kwargs
  structured_output: json_schema
  # The server's --max-model-len.
  context_tokens: 262144
  max_image_width: 768
reasoning:
  backend: openai_compatible
  base_url: http://127.0.0.1:8000/v1
  # Deviation (see notes): the Mistral reasoning slot uses the same local Qwen3.6 server as
  # perception, text-only, thinking off, json_schema structured output.
  model: nvidia/Qwen3.6-35B-A3B-NVFP4
  quantization: NVFP4
  timeout_seconds: 120
  max_tokens: 1024
  temperature: 0.0
  retries: 2
  think: false
  think_param: chat_template_kwargs
  structured_output: json_schema
  # The server's --max-model-len.
  context_tokens: 262144
media:
  sample_fps: 1
  max_frames_per_camera: 12
  max_width: 768
  concurrency: 2
