# Home camera wall ("/", "Site cameras"): which clips fill the CCTV tiles.
# Read by apps/api/services/wall.py (GET /api/wall); editable without code.
#
# Clips come from the /hazards clip store (data/hazards/clips/<clip_id>/clip.json). The
# tiles play the raw source.mp4 (no AI markings); results appear only after a check.

title: Site cameras · Factory floor
hazard_title: Hazard watch                   # factory clips (kind "hazard"), from CAM 1
blindspot_title: Blind spot watch · Warehouse  # warehouse clips (kind "blindspot"), numbered on
hazard_watch_label: HAZARD WATCH
blindspot_watch_label: BLIND SPOT

# Clip ids, in tile order. Empty: the first four hazard clips by id / every blind-spot
# clip in id order (at most four). Ids that are not staged are skipped.
hazard_clips: [hz_00, hz_01, hz_02]   # factory clips with stored GB10 Qwen runs (replayable)
blindspot_clips: [bs_01]              # one warehouse clip; numbered after the factory row (CAM 4)
# false hides the blind-spot row (hazard-only demo); the clips stay on /hazards.
show_blindspot: true

# When each tile's automatic check starts, in seconds after the wall loads.
# Staggered so factory and warehouse checks interleave and all land within about 25 s.
hazard_check_after_s: [2, 4, 6, 8]
blindspot_check_after_s: [3.5, 6.5, 9.5]
